spring.application.name=dimdim

# Nada sensível aqui: os valores vêm de variáveis de ambiente.
# Na Azure, são definidas com "az webapp config appsettings set".
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# As tabelas são criadas pelo scripts/ddl.sql, não pelo Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
