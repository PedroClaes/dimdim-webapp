<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: head('Erro')}"></head>
<body>
<header th:replace="~{fragments :: topo('')}"></header>
<main class="pagina">
    <div class="vazio">
        <h1 th:text="${status == 404} ? 'Registro não encontrado' : 'Não foi possível concluir a operação'">Erro</h1>
        <p th:text="'Código ' + ${status}">Código</p>
        <a class="botao" th:href="@{/}">Voltar para clientes</a>
    </div>
</main>
</body>
</html>
