<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:replace="~{fragments :: head(${cliente.id == null} ? 'Novo cliente' : 'Editar cliente')}"></head>
<body>
<header th:replace="~{fragments :: topo('clientes')}"></header>

<main class="pagina">
    <div class="cabecalho-pagina">
        <div>
            <h1 th:text="${cliente.id == null} ? 'Novo cliente' : 'Editar cliente'">Cliente</h1>
            <p th:if="${cliente.id != null}" th:text="'Registro ID ' + ${cliente.id}"></p>
        </div>
    </div>

    <form class="formulario" method="post" novalidate th:object="${cliente}"
          th:action="${cliente.id == null} ? @{/clientes} : @{/clientes/{id}(id=${cliente.id})}">

        <div class="campo">
            <label for="nome">Nome completo</label>
            <input type="text" th:field="*{nome}" maxlength="100" autocomplete="name" th:errorclass="campo-invalido">
            <p class="erro" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></p>
        </div>

        <div class="campo">
            <label for="cpf">CPF</label>
            <input type="text" th:field="*{cpf}" maxlength="11" inputmode="numeric" th:errorclass="campo-invalido">
            <p class="dica">Só números, 11 dígitos.</p>
            <p class="erro" th:if="${#fields.hasErrors('cpf')}" th:errors="*{cpf}"></p>
        </div>

        <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" th:field="*{email}" maxlength="120" autocomplete="email" th:errorclass="campo-invalido">
            <p class="erro" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
        </div>

        <div class="linha-botoes">
            <button class="botao" type="submit"
                    th:text="${cliente.id == null} ? 'Cadastrar cliente' : 'Salvar alterações'">Salvar</button>
            <a class="link-acao" th:href="@{/clientes}">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
